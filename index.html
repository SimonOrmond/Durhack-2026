<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Physio Pose Pipeline</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="sticky-header">
    <h1>Your exercises <span class="tag">patient</span></h1>
    <div class="controls">
      <span class="user-chip" id="user-chip"></span>
      <label>Free play
        <select id="exercise"></select>
      </label>
      <label>Game
        <select id="game-mode">
          <option value="glider">Flappy Glider</option>
          <option value="runner">Dino Runner</option>
        </select>
      </label>
      <label>Side
        <select id="side">
          <option value="auto">Auto</option>
          <option value="R">Right</option>
          <option value="L">Left</option>
        </select>
      </label>
      <label><input type="checkbox" id="mirror" checked /> Mirror</label>
      <label><input type="checkbox" id="debug" /> Debug</label>
      <button id="start" disabled>Loading scripts…</button>
      <button id="pause" disabled title="Space or P">Pause</button>
      <button id="reset">Reset</button>
      <button id="logout">Sign out</button>
    </div>
  </header>

  <main class="patient-main">
    <!-- Camera + Game side-by-side layout -->
    <section class="live-dock">
      <div class="live-grid">
        <div class="camera-pane">
          <div class="video-wrap">
            <video id="video" playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div id="status" class="status">Loading scripts…</div>
          </div>
        </div>

        <div class="game-pane">
          <div class="game-wrap">
            <canvas id="game" width="760" height="450"></canvas>
            <div class="game-help" id="game-help">
              <b>Raise</b> &amp; <b>lower</b> smoothly to steer Dino Dan through gates · Collect <b>coins</b> &amp; beat your <b>PB</b>
            </div>
          </div>
        </div>
      </div>

      <div class="hud-strip">
        <div class="stats">
          <div class="stat">
            <div class="label">Reps</div>
            <div class="value" id="reps">0</div>
          </div>
          <div class="stat">
            <div class="label">Phase</div>
            <div class="value small" id="phase">—</div>
          </div>
          <div class="stat">
            <div class="label">Angle</div>
            <div class="value small"><span id="angle">—</span>°</div>
          </div>
          <div class="stat">
            <div class="label">Last ROM</div>
            <div class="value small" id="rom">—</div>
          </div>
        </div>

        <div class="gauge-and-cue">
          <div class="gauge">
            <div class="gauge-label"><span>Rest</span><span>Target</span></div>
            <div class="gauge-track">
              <div class="gauge-fill" id="gauge"></div>
              <div class="gauge-mark" style="left:30%"></div>
              <div class="gauge-mark" style="left:65%"></div>
            </div>
          </div>
          <div class="cue neutral" id="cue">&nbsp;</div>
          <div id="instructions" class="hidden"></div>
        </div>
      </div>

      <div class="set-progress" id="set-progress" hidden>
        <span><b id="sp-exercise"></b> · Set <span id="sp-set">1</span>/<span id="sp-sets">3</span> · Rep <span id="sp-rep">0</span>/<span id="sp-reps">10</span>
          <span class="sp-state" id="sp-state">Go</span> <b class="sp-rest" id="sp-rest"></b></span>
        <span class="sp-actions">
          <button class="small-btn" id="skip-rest" hidden>Skip rest</button>
          <button class="small-btn" id="finish">Finish &amp; save</button>
        </span>
      </div>
    </section>

    <!-- Lower content: Today's plan and debug readout -->
    <section class="lower-content">
      <div class="plan-section">
        <h3 style="margin-top:0">Today's plan <span class="muted small" id="plan-hint">from your physio</span></h3>
        <div id="plan" class="plan"><div class="muted small">Loading…</div></div>
      </div>

      <pre id="debug-out" class="debug hidden"></pre>
    </section>
  </main>

  <script>
    // Runs before the module: catch the two ways the module can silently fail to load.
    (function () {
      var status = document.getElementById("status");
      if (location.protocol === "file:") {
        status.textContent = "Opened as a file:// URL. ES modules and the camera need a server: run `npm start` and open http://localhost:5173";
        status.className = "status error";
        return;
      }
      setTimeout(function () {
        var btn = document.getElementById("start");
        if (btn.disabled && btn.textContent === "Loading scripts…") {
          status.textContent = "Scripts failed to load. Press F12 and check the Console tab for the error.";
          status.className = "status error";
        }
      }, 8000);
    })();
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
